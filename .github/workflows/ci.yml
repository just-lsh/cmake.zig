name: CI

on:
  push:
  pull_request:

jobs:
  examples:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15
          - macos-15-intel
          - windows-2025
          - windows-11-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      # Zig unpacks dependencies, including the lazily fetched CMake and Ninja,
      # into zig-pkg/ next to the build root.
      - name: Cache zig packages
        uses: actions/cache@v6
        with:
          path: zig-pkg
          key: zig-pkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.zig.zon') }}

      - run: zig build examples run-minimal --summary all
